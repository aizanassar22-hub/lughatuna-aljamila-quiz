<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="اختبر معلوماتك في النحو وإعراب القرآن الكريم مع لغتنا الجميلة"><meta property="og:type" content="website"><meta property="og:title" content="لغتنا الجميلة | اختبار تفاعلي"><meta property="og:description" content="اختبر معلوماتك في إعراب القرآن الكريم وعلوم النحو"><title>الكويز | لغتنا الجميلة</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#f6f4ec;--paper:#fffefa;--ink:#27372e;--muted:#778078;--green:#657d69;--pale:#eaf0e7;--line:#e8e4d9;--red:#a3443d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.85 Tajawal,Tahoma,Arial,sans-serif}.top{background:var(--paper);border-bottom:1px solid var(--line);padding:13px 20px}.topin{max-width:880px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}.mark{width:38px;height:38px;background:var(--green);color:#fff;border-radius:12px;display:grid;place-items:center}.tag{background:var(--pale);color:var(--green);border-radius:22px;padding:4px 11px;font-size:12px;font-weight:700}main{max-width:880px;margin:28px auto 50px;padding:0 17px}h1{font-size:28px;line-height:1.4;margin:0 0 4px}.muted{color:var(--muted);font-size:14px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:21px;box-shadow:0 12px 30px #26372b0b}.question{display:none;padding:16px 0;border-bottom:1px solid var(--line)}.question.active,.question.review{display:block}.progress-wrap{margin:12px 0 18px}.progress-track{height:7px;background:#e9e6dc;border-radius:10px;overflow:hidden}.progress-fill{height:100%;width:0;background:var(--green);transition:width .2s}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:6px}.question:last-child{border:0}.qt{font-size:18px;font-weight:700;margin-bottom:8px}.verse{font:700 23px/2 Amiri,serif;color:#405644;margin:8px 0}.option{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin:7px 0;color:var(--ink);font:500 15px/1.8 Tajawal,sans-serif;cursor:pointer}.option.selected{background:var(--pale);border-color:var(--green)}.option.correct{background:#e8f2e7;border-color:#739b72}.option.wrong{background:#fbefed;border-color:#c98b82}.option:disabled{cursor:default}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{font:700 14px Tajawal,sans-serif;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}.primary{background:var(--green);border-color:var(--green);color:white}.result{display:none;margin-top:17px;padding:15px;border-radius:13px;background:#f3f6ef}.result.show{display:block}.score{font-weight:800;font-size:24px;color:var(--green)}.item{border-top:1px solid var(--line);padding:10px 0;margin-top:8px}.good{color:var(--green);font-weight:800}.bad{color:var(--red);font-weight:800}.state{text-align:center;padding:30px 10px;color:var(--muted)}.error{color:var(--red)}footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}@media(max-width:600px){.panel{padding:14px}h1{font-size:24px}.verse{font-size:21px}.top{padding:11px 14px}}
</style></head><body><header class="top"><div class="topin"><div class="brand"><span class="mark">ل</span>لغتنا الجميلة</div><span class="tag">اختبار تفاعلي</span></div></header><main><h1 id="title">جارٍ تحميل الكويز…</h1><div class="muted" id="description">اختبر معلوماتك في النحو وإعراب القرآن الكريم</div><section class="panel" style="margin-top:18px"><div class="progress-wrap" id="progressWrap" hidden><div class="progress-label"><span id="stepLabel">السؤال ١</span><span id="stepPercent">٠٪</span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div><div id="content"><div class="state">جارٍ تحميل الأسئلة…</div></div><div id="result" class="result" aria-live="polite"></div></section><div class="controls"><button class="btn" id="back">العودة إلى الكويزات</button><button class="btn" id="share">مشاركة الكويز</button></div></main><footer>لغتنا الجميلة · بالتوفيق</footer>
<script>
const API='/api/quizzes',id=new URLSearchParams(location.search).get('id');let quiz,submitted=false,currentStep=0;const content=document.getElementById('content'),result=document.getElementById('result');document.getElementById('back').onclick=()=>location.href='/';document.getElementById('share').onclick=async()=>{let u=location.href,t=(quiz?.title||'كويز من لغتنا الجميلة')+'\n'+u;if(navigator.share){try{await navigator.share({title:quiz?.title||'لغتنا الجميلة',text:t,url:u});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(t);alert('تم نسخ رابط الكويز.')}catch(e){prompt('انسخ الرابط:',u)}};
function renderQuestion(q,i){let sec=document.createElement('article');sec.className='question';let title=document.createElement('div');title.className='qt';title.textContent=(i+1).toLocaleString('ar')+'. '+q.prompt;sec.append(title);if(q.verse){let v=document.createElement('div');v.className='verse';v.textContent=q.verse;sec.append(v)}if(q.reference){let r=document.createElement('div');r.className='muted';r.textContent='المصدر: '+q.reference;sec.append(r)}q.options.forEach((o,j)=>{let b=document.createElement('button');b.type='button';b.className='option';b.textContent=o;b.dataset.index=j;b.onclick=()=>{if(submitted)return;sec.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');sec.dataset.answer=j};sec.append(b)});return sec}
async function load(){if(!id){content.textContent='رابط الكويز غير مكتمل.';content.className='state error';return}try{let r=await fetch(API+'?id='+encodeURIComponent(id),{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'تعذّر تحميل الكويز');quiz=d;document.title=quiz.title+' | لغتنا الجميلة';document.getElementById('title').textContent=quiz.title;document.getElementById('description').textContent=quiz.description||'اختبر معلوماتك في النحو وإعراب القرآن الكريم';content.replaceChildren();quiz.questions.forEach((q,i)=>{let node=renderQuestion(q,i);if(i===0)node.classList.add('active');content.append(node)});document.getElementById('progressWrap').hidden=false;const nav=document.createElement('div');nav.className='controls';const prev=document.createElement('button');prev.className='btn';prev.textContent='السؤال السابق';prev.disabled=true;prev.onclick=()=>showStep(currentStep-1);const next=document.createElement('button');next.className='btn primary';next.textContent='السؤال التالي';next.onclick=()=>showStep(currentStep+1);const submit=document.createElement('button');submit.className='btn primary';submit.textContent='تحقق من الإجابات';submit.hidden=true;submit.onclick=submitAnswers;nav.append(prev,next,submit);content.append(nav);nav.dataset.prev='';showStep(0)}catch(e){content.className='state error';content.textContent=e.message||'حدث خطأ أثناء تحميل الكويز.'}}
function showStep(index){const qs=[...content.querySelectorAll('.question')];if(index<0||index>=qs.length)return;currentStep=index;qs.forEach((q,i)=>q.classList.toggle('active',i===index));const nav=content.querySelector('.controls'),buttons=nav.querySelectorAll('button'),prev=buttons[0],next=buttons[1],submit=buttons[2];prev.disabled=index===0;next.hidden=index===qs.length-1;submit.hidden=index!==qs.length-1;document.getElementById('stepLabel').textContent='السؤال '+(index+1).toLocaleString('ar')+' من '+qs.length.toLocaleString('ar');let pct=Math.round(((index+1)/qs.length)*100);document.getElementById('stepPercent').textContent=pct.toLocaleString('ar')+'٪';document.getElementById('progressFill').style.width=pct+'%';}
async function submitAnswers(){if(submitted)return;let qs=[...content.querySelectorAll('.question')],answers=qs.map(q=>q.dataset.answer===undefined?null:Number(q.dataset.answer));if(answers.some(x=>x===null)){let missing=answers.findIndex(x=>x===null);showStep(missing);alert('أجب عن جميع الأسئلة أولًا.');return}let b=content.querySelector('.primary');b.disabled=true;b.textContent='جارٍ التصحيح…';try{let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'submit',id:quiz.id,answers})}),d=await r.json();if(!r.ok)throw Error(d.error||'تعذّر التصحيح');submitted=true;qs.forEach((q,i)=>{q.classList.add('review');let x=d.results[i];q.querySelectorAll('.option').forEach((o,j)=>{o.disabled=true;if(j===x.correctIndex)o.classList.add('correct');else if(j===x.selectedIndex&&!x.isCorrect)o.classList.add('wrong')});let line=document.createElement('div');line.className='item';let status=document.createElement('div');status.className=x.isCorrect?'good':'bad';status.textContent=x.isCorrect?'✓ إجابة صحيحة':'✕ إجابة غير صحيحة';line.append(status);if(x.explanation){let ex=document.createElement('div');ex.className='muted';ex.textContent=x.explanation;line.append(ex)}q.append(line)});b.remove();content.querySelector('.controls')?.remove();result.classList.add('show');let score=document.createElement('div');score.className='score';score.textContent='نتيجتك: '+d.score.toLocaleString('ar')+' من '+d.total.toLocaleString('ar');let pct=document.createElement('div');pct.textContent='النسبة: '+d.percentage.toLocaleString('ar')+'٪';let retry=document.createElement('button');retry.className='btn';retry.textContent='إعادة المحاولة';retry.style.marginTop='10px';retry.onclick=()=>location.reload();result.replaceChildren(score,pct,retry);result.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){alert(e.message||'حدث خطأ أثناء التصحيح');b.disabled=false;b.textContent='تحقق من الإجابات'}}load();
</script></body></html>
